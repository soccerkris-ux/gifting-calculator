<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>New York Gifting Explorer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f1f4f5;
      color: #203c47;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      max-width: 1120px;
      margin: auto;
      padding: 35px 20px;
    }

    h1 {
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.15;
      margin: 12px 0;
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    h3 {
      font-size: 17px;
    }

    p,
    li {
      line-height: 1.6;
    }

    .eyebrow {
      color: #607780;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .intro {
      max-width: 800px;
      color: #607780;
    }

    .grid {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .card {
      background: white;
      border: 1px solid #d9e1e3;
      border-radius: 18px;
      padding: 24px;
      margin: 20px 0;
    }

    label {
      display: block;
      font-weight: 650;
      font-size: 14px;
      margin-top: 17px;
    }

    input {
      width: 100%;
      font: inherit;
      color: inherit;
      padding: 10px;
      border: 1px solid #b8c9ce;
      border-radius: 8px;
      margin-top: 6px;
      background: white;
    }

    input[type="range"] {
      padding: 0;
      accent-color: #327489;
    }

    small {
      display: block;
      line-height: 1.5;
      font-size: 12px;
      color: #607780;
      margin-top: 6px;
    }

    .hero {
      background: #244c5a;
      color: white;
      border-radius: 12px;
      padding: 23px;
    }

    .hero-label {
      font-size: 14px;
      color: #d6e6ed;
    }

    .hero output {
      display: block;
      font-size: clamp(30px, 4vw, 42px);
      font-weight: 750;
      margin: 8px 0;
      overflow-wrap: anywhere;
    }

    .hero-note {
      color: #d6e6ed;
      font-size: 13px;
      line-height: 1.5;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin: 20px 0;
    }

    .stats output {
      font-size: 23px;
      font-weight: 700;
      display: block;
      margin-top: 6px;
      overflow-wrap: anywhere;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }

    th,
    td {
      padding: 11px 5px;
      border-bottom: 1px solid #e0e7e9;
      text-align: right;
      vertical-align: top;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    tbody tr:last-child {
      font-weight: 700;
      background: #f0f5f7;
    }

    .notice {
      background: #fff3d6;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    .status {
      background: #eef4f6;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    details {
      margin-top: 20px;
    }

    details:first-child {
      margin-top: 0;
    }

    summary {
      font-weight: 650;
      cursor: pointer;
      line-height: 1.5;
    }

    li {
      margin-bottom: 10px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    button {
      background: #244c5a;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      margin-top: 20px;
      cursor: pointer;
      font: inherit;
    }

    button:hover {
      background: #32697c;
    }

    input:focus-visible,
    button:focus-visible,
    summary:focus-visible {
      outline: 3px solid #9fc7d5;
      outline-offset: 3px;
    }

    #error {
      color: #9d2525;
      font-size: 13px;
    }
